{% extends 'base.html' %}
{% block title %}Edit Stock{% endblock %}
{% block page_title %}Edit Stock Material{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow mb-4">
            <div class="card-header bg-white py-3">
                <h6 class="m-0 font-weight-bold text-primary">Update Stock Region {{ region }}</h6>
            </div>
            <div class="card-body">
                <div class="alert alert-secondary">
                    <strong>Material Code:</strong> {{ mat.code }}<br>
                    <strong>Name:</strong> {{ mat.name }}
                </div>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Stock Amount</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-box-seam"></i></span>
                            <input type="number" name="stock" value="{{ rstock.stock }}" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('main.materials') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Update Stock</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
