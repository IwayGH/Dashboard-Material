{% extends 'base.html' %}
{% block title %}Login Dashboard{% endblock %}

{% block login_content %}
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-3 mb-1 font-weight-bold text-dark">Material Dashboard</h3>
                <p class="text-muted">Silakan login untuk melanjutkan</p>
            </div>
            {% if error %}<div class="alert alert-danger text-center py-2">{{ error }}</div>{% endif %}
            <form method="post" action="{{ url_for('auth.login_auth') }}">
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="floatingUsername" placeholder="Username" required>
                    <label for="floatingUsername">Username</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
